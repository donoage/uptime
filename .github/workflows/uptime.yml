name: uptime

on:
  # GitHub registers this schedule from the default branch's workflow file; a change here re-registers it.
  # Hourly, not */5: GitHub fired a */5 schedule 3 times in 17 h on this low-activity repo. Each run probes
  # every 5 min for ~55 min (UPTIME_ROUNDS below), so 5-minute coverage survives a late or skipped hour.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true  # a newer run takes over; the old one's state was saved after its last round

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65  # 11 rounds x 5 min = ~55 min of probing; far under the 6 h job limit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # consecutive-failure counts, carried from the newest earlier run
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-
      - name: Probe
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPTIME_STATE: state/state.json
          UPTIME_ROUNDS: "11"
          UPTIME_INTERVAL_SEC: "300"
        run: python3 probe.py
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: always()
        with:
          path: state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
